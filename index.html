<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO Coffee - ระบบจัดการตารางกะ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; }
        .uno-orange { background-color: #f97316; }
        .uno-orange-text { color: #f97316; }
    </style>
</head>
<body>

    <!-- หน้า Login -->
    <div id="loginPage" class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 transform transition-all">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-full uno-orange shadow-lg mb-4">
                    <i class="fas fa-coffee text-4xl text-white"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-800">UNO Coffee</h2>
                <p class="text-gray-500 mt-2">เข้าสู่ระบบจัดการตารางกะพนักงาน</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-5">
                    <label class="block text-gray-700 text-sm font-semibold mb-2">รหัสพนักงาน</label>
                    <input type="text" id="empId" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 transition-shadow" placeholder="เช่น 100014" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-semibold mb-2">รหัส PIN</label>
                    <input type="password" id="empPin" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 transition-shadow" placeholder="ใส่รหัส PIN" required>
                </div>
                <button type="submit" id="loginBtn" class="w-full uno-orange text-white font-bold py-3 px-4 rounded-lg hover:bg-orange-600 active:bg-orange-700 transition duration-300 shadow-md">
                    เข้าสู่ระบบ
                </button>
            </form>
            <div id="loginError" class="text-red-500 bg-red-50 p-3 rounded-lg text-center text-sm mt-4 hidden border border-red-100">
                <!-- ข้อความ Error จะมาแสดงตรงนี้ -->
            </div>
        </div>
    </div>

    <!-- หน้า Dashboard -->
    <div id="dashboardPage" class="hidden min-h-screen">
        <!-- แถบเมนูด้านบน -->
        <nav class="bg-white shadow-md px-6 py-4 flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center space-x-3">
                <i class="fas fa-coffee uno-orange-text text-2xl"></i>
                <h1 class="text-xl font-bold text-gray-800 hidden sm:block">UNO Schedule Dashboard</h1>
            </div>
            <div class="flex items-center space-x-4">
                <div class="text-right hidden sm:block">
                    <p id="userNameDisplay" class="text-gray-800 font-bold text-sm"></p>
                    <p id="userRoleDisplay" class="text-gray-500 text-xs"></p>
                </div>
                <button onclick="logout()" class="bg-red-50 text-red-600 hover:bg-red-100 px-4 py-2 rounded-lg text-sm font-semibold transition-colors">
                    <i class="fas fa-sign-out-alt mr-1"></i> ออกจากระบบ
                </button>
            </div>
        </nav>

        <!-- ส่วนเนื้อหาหลัก -->
        <div class="p-4 sm:p-6 max-w-7xl mx-auto">
            <!-- ส่วนหัวตารางและปุ่มอัปเดต -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 space-y-4 sm:space-y-0">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">ข้อมูลตารางกะและสาขา</h2>
                    <p class="text-gray-500 text-sm mt-1">แสดงข้อมูลจากฐานข้อมูลของระบบ</p>
                </div>
                <button onclick="fetchSchedule()" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-50 shadow-sm transition-colors flex items-center">
                    <i class="fas fa-sync-alt mr-2" id="syncIcon"></i> ดึงข้อมูลล่าสุด
                </button>
            </div>

            <!-- กล่องแสดงสถานะโหลดข้อมูล -->
            <div id="loadingStatus" class="bg-white rounded-xl shadow-sm p-10 text-center hidden">
                <i class="fas fa-circle-notch fa-spin text-4xl text-orange-500 mb-4"></i>
                <p class="text-gray-600 font-medium">กำลังโหลดข้อมูลจากเซิร์ฟเวอร์...</p>
            </div>

            <!-- พื้นที่แสดงข้อมูล Data (รองรับการใส่ตารางตารางกะในอนาคต) -->
            <div id="dataContainer" class="bg-white rounded-xl shadow-sm overflow-hidden">
                <div class="p-6 border-b border-gray-100 bg-gray-50">
                    <h3 class="font-bold text-gray-700"><i class="fas fa-database mr-2 text-orange-500"></i> ข้อมูลที่ดึงได้จาก API (Raw Data)</h3>
                </div>
                <div class="p-6 overflow-x-auto">
                    <pre id="rawDataDisplay" class="bg-gray-800 text-green-400 p-4 rounded-lg text-xs font-mono overflow-auto max-h-96">ยังไม่มีข้อมูล</pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        // URL API ของ Google Apps Script Web App ของคุณ
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyJiifHqJ1oAdu10oBMXJ_F4DhVz_7snG7vOKm_mmC69-e_MPBQgPse65Q3UG0HqQVAWA/exec';

        // ฟังก์ชันส่ง Request หา API
        async function callApi(payload) {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            return await response.json();
        }

        // ฟังก์ชันเข้าสู่ระบบ
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const empId = document.getElementById('empId').value.trim();
            const empPin = document.getElementById('empPin').value.trim();
            const errorMsg = document.getElementById('loginError');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> กำลังตรวจสอบ...';
            errorMsg.classList.add('hidden');

            try {
                const data = await callApi({ 
                    op: 'login', 
                    args: { emp: empId, pin: empPin } 
                });

                if (data.error) throw new Error(data.error);

                // หากสำเร็จ เก็บข้อมูลลง LocalStorage
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('uno_token', data.token);
                localStorage.setItem('empId', data.me.emp);
                localStorage.setItem('empRole', data.me.role || 'User');
                localStorage.setItem('empName', data.me.name || empId);
                
                showDashboard();
            } catch (error) {
                errorMsg.innerHTML = `<i class="fas fa-exclamation-circle mr-1"></i> ${error.message || 'รหัสพนักงานหรือ PIN ไม่ถูกต้อง'}`;
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = 'เข้าสู่ระบบ';
            }
        }

        // แสดงหน้า Dashboard
        function showDashboard() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('dashboardPage').classList.remove('hidden');
            
            document.getElementById('userNameDisplay').innerText = `คุณ ${localStorage.getItem('empName')}`;
            
            const role = localStorage.getItem('empRole');
            const roleText = role === 'super' ? 'Super Admin' : (role === 'admin' ? 'Manager' : 'Staff');
            document.getElementById('userRoleDisplay').innerText = `ระดับสิทธิ์: ${roleText}`;
            
            fetchSchedule();
        }

        // ฟังก์ชันออกจากระบบ
        async function logout() {
            const token = localStorage.getItem('uno_token');
            if (token) {
                // ส่งแจ้ง Backend เพื่อลบ Token ทิ้ง
                callApi({ op: 'logout', token: token }).catch(e => console.log(e));
            }
            
            localStorage.clear();
            
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('dashboardPage').classList.add('hidden');
            document.getElementById('empId').value = '';
            document.getElementById('empPin').value = '';
            
            const btn = document.getElementById('loginBtn');
            btn.disabled = false;
            btn.innerHTML = 'เข้าสู่ระบบ';
        }

        // ฟังก์ชันดึงข้อมูลจาก API (Load)
        async function fetchSchedule() {
            const container = document.getElementById('dataContainer');
            const loading = document.getElementById('loadingStatus');
            const rawDisplay = document.getElementById('rawDataDisplay');
            const syncIcon = document.getElementById('syncIcon');
            const token = localStorage.getItem('uno_token');
            
            container.classList.add('hidden');
            loading.classList.remove('hidden');
            syncIcon.classList.add('fa-spin');

            try {
                const data = await callApi({ 
                    op: 'load', 
                    token: token 
                });

                loading.classList.add('hidden');
                syncIcon.classList.remove('fa-spin');
                container.classList.remove('hidden');

                if (data.error) {
                     if (data.auth) logout(); // หมดอายุเตะออก
                     throw new Error(data.error);
                }

                // นำข้อมูลที่ได้จาก API มาแสดงผล (ในอนาคตคุณสามารถนำ data.docs ไปวนลูปสร้างตาราง Table สวยๆ ได้)
                rawDisplay.innerText = JSON.stringify(data, null, 2);

            } catch (error) {
                loading.classList.add('hidden');
                syncIcon.classList.remove('fa-spin');
                container.classList.remove('hidden');
                rawDisplay.innerHTML = `<span class="text-red-400">Error: ${error.message}</span>`;
            }
        }

        // ทำงานเมื่อโหลดหน้าเว็บ
        window.onload = () => {
            if (localStorage.getItem('isLoggedIn') === 'true') {
                showDashboard();
            }
        };
    </script>
</body>
</html>
