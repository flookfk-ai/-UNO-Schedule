<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO Coffee - ตารางกะการทำงาน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; }
        .uno-orange { background-color: #f97316; }
        .uno-orange-text { color: #f97316; }
    </style>
</head>
<body>

    <!-- หน้าต่าง Login -->
    <div id="loginPage" class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
        <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full uno-orange mb-4">
                    <i class="fas fa-coffee text-2xl text-white"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">UNO Coffee</h2>
                <p class="text-gray-500 mt-2">เข้าสู่ระบบจัดการตารางกะ</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-semibold mb-2">รหัสพนักงาน</label>
                    <input type="text" id="empId" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="เช่น 100014" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-semibold mb-2">PIN</label>
                    <input type="password" id="empPin" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="รหัส PIN ของคุณ" required>
                </div>
                <button type="submit" id="loginBtn" class="w-full uno-orange text-white font-bold py-3 px-4 rounded-lg hover:bg-orange-600 transition duration-300">
                    เข้าสู่ระบบ
                </button>
            </form>
            <div id="loginError" class="text-red-500 text-center text-sm mt-4 hidden">
                รหัสพนักงานหรือ PIN ไม่ถูกต้อง
            </div>
        </div>
    </div>

    <!-- หน้า Dashboard ตารางกะ (ซ่อนไว้จนกว่าจะล็อกอินผ่าน) -->
    <div id="dashboardPage" class="hidden min-h-screen">
        <!-- Navbar -->
        <nav class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fas fa-coffee uno-orange-text text-xl"></i>
                <h1 class="text-xl font-bold text-gray-800">UNO Schedule</h1>
            </div>
            <div class="flex items-center space-x-4">
                <span id="userNameDisplay" class="text-gray-600 font-medium"></span>
                <button onclick="logout()" class="text-red-500 hover:text-red-700 text-sm font-semibold">
                    <i class="fas fa-sign-out-alt mr-1"></i> ออกจากระบบ
                </button>
            </div>
        </nav>

        <!-- Content -->
        <div class="p-6 max-w-7xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">ตารางกะสัปดาห์นี้</h2>
                <button onclick="fetchSchedule()" class="bg-blue-50 text-blue-600 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-100">
                    <i class="fas fa-sync-alt mr-1"></i> รีเฟรชข้อมูล
                </button>
            </div>

            <!-- กล่องแสดงสถานะโหลดข้อมูล -->
            <div id="loadingStatus" class="text-center py-10 hidden">
                <i class="fas fa-circle-notch fa-spin text-4xl text-orange-500 mb-3"></i>
                <p class="text-gray-500">กำลังโหลดข้อมูลตารางกะ...</p>
            </div>

            <!-- ตาราง (ตัวอย่างโครงสร้าง) -->
            <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">วัน/วันที่</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">กะการทำงาน</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">สาขา</th>
                            </tr>
                        </thead>
                        <tbody id="scheduleTableBody" class="bg-white divide-y divide-gray-200">
                            <!-- ข้อมูลจาก API จะถูกนำมาใส่ตรงนี้ -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // *** นำ URL ของ Google Apps Script (ลงท้ายด้วย /exec) มาวางตรงนี้ ***
        const SCRIPT_URL = 'YOUR_APPS_SCRIPT_URL_HERE';

        // ฟังก์ชันล็อกอิน
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const empId = document.getElementById('empId').value;
            const empPin = document.getElementById('empPin').value;
            const errorMsg = document.getElementById('loginError');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> กำลังตรวจสอบ...';
            errorMsg.classList.add('hidden');

            try {
                // เรียกใช้ API เพื่อตรวจสอบ (สมมติว่า API ของคุณรองรับ action=login)
                // หรือหากคุณต้องการใช้แค่ตรวจสอบใน Frontend ชั่วคราวด้วยชีตที่ส่งมา
                if (empId && empPin === empId) { // เบื้องต้น PIN เหมือน ID จากตัวอย่างข้อมูล
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('empId', empId);
                    showDashboard();
                } else {
                    throw new Error('Invalid credentials');
                }
            } catch (error) {
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = 'เข้าสู่ระบบ';
            }
        }

        // แสดงหน้า Dashboard
        function showDashboard() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('dashboardPage').classList.remove('hidden');
            document.getElementById('userNameDisplay').innerText = 'รหัสพนักงาน: ' + localStorage.getItem('empId');
            fetchSchedule(); // โหลดข้อมูลกะเมื่อล็อกอินผ่าน
        }

        // ออกจากระบบ
        function logout() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('empId');
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('dashboardPage').classList.add('hidden');
            document.getElementById('empId').value = '';
            document.getElementById('empPin').value = '';
            document.getElementById('loginBtn').disabled = false;
            document.getElementById('loginBtn').innerHTML = 'เข้าสู่ระบบ';
        }

        // ตรวจสอบสถานะการล็อกอินเมื่อเปิดหน้าเว็บ
        window.onload = () => {
            if (localStorage.getItem('isLoggedIn') === 'true') {
                showDashboard();
            }
        };

        // ฟังก์ชันดึงตารางกะจาก API
        async function fetchSchedule() {
            const tableBody = document.getElementById('scheduleTableBody');
            const loading = document.getElementById('loadingStatus');
            
            tableBody.innerHTML = '';
            loading.classList.remove('hidden');

            try {
                // ยิง API ไปที่ Apps Script (ตัวอย่างการใช้งาน)
                // const response = await fetch(`${SCRIPT_URL}?action=getSchedule&id=${localStorage.getItem('empId')}`);
                // const data = await response.json();
                
                // สำหรับเป็นตัวอย่างแสดงผล หาก API ยังไม่ได้ตั้งค่า
                setTimeout(() => {
                    const mockData = [
                        { date: 'จันทร์ 2 พ.ย. 2026', shift: 'M1 (06:00 - 15:00)', branch: 'MJR' },
                        { date: 'อังคาร 3 พ.ย. 2026', shift: 'A1 (13:00 - 22:00)', branch: 'MJR' },
                        { date: 'พุธ 4 พ.ย. 2026', shift: 'OFF', branch: '-' }
                    ];

                    loading.classList.add('hidden');
                    
                    mockData.forEach(row => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${row.date}</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full ${row.shift === 'OFF' ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'}">
                                    ${row.shift}
                                </span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${row.branch}</td>
                        `;
                        tableBody.appendChild(tr);
                    });
                }, 1000);

            } catch (error) {
                loading.classList.add('hidden');
                tableBody.innerHTML = '<tr><td colspan="3" class="text-center text-red-500 py-4">ไม่สามารถเชื่อมต่อข้อมูลได้</td></tr>';
            }
        }
    </script>
</body>
</html>
